# Home Assistant Add-on Repository

name: Scrcpy Web Add-on
version: 1.0.0
description: Repository for Scrcpy Web add-on
type: repository

addons:
  - name: Scrcpy Web
    description: Web client for scrcpy and more
    repository: https://github.com/NetrisTV/ws-scrcpy
    version: 0.8.1-a1
    slug: scrcpy
    url: https://github.com/NetrisTV/ws-scrcpy
    stage: stable
    maintainer: Sergey Volkov <drauggres@gmail.com>
    arch:
      - aarch64
      - amd64
    startup: application
    boot: auto
    image: ghcr.io/netristv/ws-scrcpy/{arch}
